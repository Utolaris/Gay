[project]
name = "gay-orientation"
version = "0.1.0"
description = "Independent Intervention API for male-biased courtship-circuit experiments on MaleCNS"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.0.2",
  "scipy==1.13.1",
  "pyarrow==21.0.0",
  "numba==0.60.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
